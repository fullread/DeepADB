version: 2
updates:
  # npm dependencies (runtime + dev). Dev deps grouped to reduce PR noise.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      dev-dependencies:
        dependency-type: "development"
    cooldown:
      default-days: 7
      semver-major-days: 30
      include:
        - "*"

  # Keep GitHub Actions versions current as well.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    cooldown:
      default-days: 7
      include:
        - "*"
