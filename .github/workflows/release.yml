name: Release

# Triggered by pushing a version tag (v1.1.2, v1.2.0, etc.).
# Publishes the package to npm with Sigstore provenance, providing a
# verifiable attestation that the published tarball was built from this
# exact GitHub commit by this exact workflow run.
#
# Authentication: npm Trusted Publishing (OIDC) -- no stored token. The publish
# is authorized by the workflow OIDC identity, configured one-time on npmjs.com
# (deepadb -> Settings -> Trusted Publisher -> GitHub Actions -> fullread/DeepADB,
# workflow release.yml). Requires npm >= 11.5.1 (upgraded in a step below) and the
# id-token: write permission; provenance is attached automatically.
#
# MCP Registry publication remains a separate manual step via mcp-publisher.exe.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write  # Required for npm provenance via Sigstore OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for trusted publishing (OIDC needs npm >= 11.5.1)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
