name: Test

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build & device-free tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [ 22.x, 24.x ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Lint
        run: npx eslint src

      - name: Test emulator CI runner
        run: node --test tests/ci/*.test.mjs

      # Device-free suites only — boundaries, focused diagnostics, result-handles,
      # supply-chain, transports, and sanitizer fuzzing. No connected device or
      # emulator is required; device-dependent assertions skip-guard automatically.
      - name: Run device-free test suites
        run: node tests/run-all.mjs --ci

  coverage:
    name: Coverage (device-free)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Collect coverage over device-free suites
        run: npx c8 node tests/run-all.mjs --ci

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: warn

  dependency-audit:
    name: Dependency security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --include=dev

      # Report every severity, but fail the job for high or critical advisories.
      # Development dependencies are included because build/CI tooling is in scope.
      - name: Audit runtime and development dependencies
        run: npm audit --include=dev --audit-level=high
